<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>年度游戏评价生成器 (带存档版)</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #007bff;
            --c-hang: #FFD700; 
            --c-top: #A335EE; 
            --c-upper: #FF4444;
            --c-npc: #4488FF; 
            --c-trash: #55AA55;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            background: #222;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
            text-align: center;
            border: 1px solid #333;
        }

        /* 顶部功能栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
        }
        
        .file-btn {
            background: #444;
            font-size: 14px;
            padding: 8px 15px;
        }
        .file-btn:hover { background: #666; }

        .status-text {
            color: #888;
            font-size: 14px;
            line-height: 32px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px 15px;
            width: 60%;
            border-radius: 6px;
            border: 1px solid #444;
            background: #333;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        button {
            padding: 10px 25px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #0056b3; }

        select {
            padding: 10px;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 15px;
        }

        #search-results {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            min-height: 140px;
            align-items: center;
            justify-content: flex-start;
        }
        #search-results::-webkit-scrollbar { height: 8px; }
        #search-results::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        
        .result-item {
            flex: 0 0 auto;
            cursor: pointer;
            width: 90px;
            transition: transform 0.2s;
            position: relative;
        }
        .result-item:hover { transform: scale(1.1); z-index: 10; }
        .result-item img {
            width: 100%;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .source-badge {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 截图区域 */
        #tier-list-container {
            background: #0d0d0d;
            padding: 30px;
            border-radius: 10px;
            width: 1000px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border: 1px solid #333;
        }

        .header-title {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 25px;
            color: #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .tier-row {
            display: flex;
            background: #151515;
            margin-bottom: 6px;
            border: 1px solid #222;
        }

        .tier-label {
            width: 130px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            color: #111;
            text-align: center;
            flex-shrink: 0;
            line-height: 1.2;
            padding: 0 5px;
        }

        .tier-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            padding: 8px;
            gap: 8px;
            min-height: 140px;
        }

        .row-hang .tier-label { background: var(--c-hang); }
        .row-top .tier-label { background: var(--c-top); color: #fff; }
        .row-upper .tier-label { background: var(--c-upper); color: #fff; }
        .row-npc .tier-label { background: var(--c-npc); color: #fff; }
        .row-trash .tier-label { background: var(--c-trash); }

        .game-card {
            width: 86px;
            height: 129px;
            position: relative;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            cursor: grab;
        }
        .game-card:hover { transform: scale(1.05); z-index: 5; }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-btn {
            position: absolute;
            top: 0; right: 0;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            width: 22px; height: 22px;
            text-align: center;
            line-height: 22px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            z-index: 20;
        }
        .game-card:hover .delete-btn { display: block; }

        .footer-watermark {
            text-align: right;
            margin-top: 15px;
            color: #555;
            font-size: 12px;
            font-family: monospace;
        }

        .actions { margin-top: 30px; }
        .save-btn {
            background: #28a745;
            padding: 15px 60px;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4);
        }
        .save-btn:hover { background: #218838; transform: translateY(-2px); }

    </style>
</head>
<body>

    <div class="controls">
        <div class="top-bar">
            <div>
                <button class="file-btn" onclick="exportData()">💾 导出存档</button>
                <button class="file-btn" onclick="document.getElementById('file-input').click()">📂 导入存档</button>
                <button class="file-btn" onclick="clearAll()" style="background:#8B0000;color:#fff">🗑️ 一键清空</button>
                <input type="file" id="file-input" style="display:none" onchange="importData(this)" accept=".json">
            </div>
            <div class="status-text" id="status-msg">✅ 自动保存已开启</div>
        </div>

        <h2 style="margin-top:0">🕹️ 游戏搜寻终端</h2>
        <div class="input-group">
            <input type="text" id="game-input" placeholder="输入游戏名 (支持中文 / 英文 / 缩写)" onkeypress="handleEnter(event)">
            <button onclick="searchGame()">🚀 搜索</button>
        </div>
        
        <div style="margin-bottom: 15px; color: #aaa; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <span>将选中封面加入到：</span>
            <select id="target-tier">
                <option value="tier-hang">🔥 夯 (T0)</option>
                <option value="tier-top">✨ 顶级 (T1)</option>
                <option value="tier-upper">👍 人上人 (T2)</option>
                <option value="tier-npc">😐 NPC (T3)</option>
                <option value="tier-trash">🗑️ 拉完了 (T4)</option>
            </select>
        </div>

        <div id="search-results"></div>
    </div>

    <div id="tier-list-container">
        <div class="header-title">2025 游戏评价表</div>

        <div class="tier-row row-hang">
            <div class="tier-label">夯</div>
            <div class="tier-content" id="tier-hang"></div>
        </div>

        <div class="tier-row row-top">
            <div class="tier-label">顶级</div>
            <div class="tier-content" id="tier-top"></div>
        </div>

        <div class="tier-row row-upper">
            <div class="tier-label">人上人</div>
            <div class="tier-content" id="tier-upper"></div>
        </div>

        <div class="tier-row row-npc">
            <div class="tier-label">NPC</div>
            <div class="tier-content" id="tier-npc"></div>
        </div>

        <div class="tier-row row-trash">
            <div class="tier-label">拉完了</div>
            <div class="tier-content" id="tier-trash"></div>
        </div>

        <div class="footer-watermark">GENERATED BY GAME TIER MAKER</div>
    </div>

    <div class="actions">
        <button class="save-btn" onclick="saveImage()">📸 保存评价表</button>
    </div>

    <script>
        // === 存档功能逻辑区 ===

        // 页面加载时，尝试读取自动存档
        window.onload = function() {
            loadFromLocalStorage();
        };

        function saveToLocalStorage() {
            const data = collectData();
            localStorage.setItem('gameTierData', JSON.stringify(data));
            showStatus("已自动保存");
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem('gameTierData');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    restoreData(data);
                    showStatus("已恢复上次进度");
                } catch(e) {
                    console.error("读取存档失败", e);
                }
            }
        }

        function collectData() {
            // 收集当前所有层级里的图片URL
            const data = {};
            const tiers = ['tier-hang', 'tier-top', 'tier-upper', 'tier-npc', 'tier-trash'];
            
            tiers.forEach(tierId => {
                const container = document.getElementById(tierId);
                const cards = container.getElementsByClassName('game-card');
                const urls = [];
                for(let card of cards) {
                    // 我们在创建卡片时把原始URL存在了 data-origin-url 属性里
                    urls.push(card.dataset.originUrl); 
                }
                data[tierId] = urls;
            });
            return data;
        }

        function restoreData(data) {
            // 清空当前界面
            const tiers = ['tier-hang', 'tier-top', 'tier-upper', 'tier-npc', 'tier-trash'];
            tiers.forEach(id => document.getElementById(id).innerHTML = '');

            // 重新填充
            for (const tierId of tiers) {
                const urls = data[tierId];
                if (urls && Array.isArray(urls)) {
                    urls.forEach(url => {
                        createCardAndAppend(url, tierId, false); // false 表示恢复模式，不重复触发保存
                    });
                }
            }
        }

        function exportData() {
            const data = collectData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "my_game_tier_list.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    restoreData(data);
                    saveToLocalStorage(); // 导入后立即更新自动存档
                    showStatus("存档导入成功");
                } catch(err) {
                    alert("存档文件格式错误！");
                }
            };
            reader.readAsText(file);
            // 清空input防止无法重复导入同一个文件
            input.value = '';
        }

        function showStatus(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = `✅ ${msg}`;
            setTimeout(() => { el.innerText = "✅ 自动保存已开启"; }, 2000);
        }

        function clearAll() {
            if (!confirm('确定要清空所有层级的游戏吗？此操作不可撤销。')) return;
            const tiers = ['tier-hang', 'tier-top', 'tier-upper', 'tier-npc', 'tier-trash'];
            tiers.forEach(id => document.getElementById(id).innerHTML = '');
            saveToLocalStorage();
            showStatus('已清空全部内容');
        }

        // === 核心业务逻辑区 ===

        function handleEnter(e) { if(e.key === 'Enter') searchGame(); }

        async function searchGame() {
            const query = document.getElementById('game-input').value.trim();
            const resultsDiv = document.getElementById('search-results');
            
            if (!query) {
                resultsDiv.innerHTML = '';
                return;
            }
            resultsDiv.innerHTML = '<span style="color:#888;">正在同时检索 Steam 商店与图库...</span>';

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                resultsDiv.innerHTML = '';
                if (data.length === 0) {
                    resultsDiv.innerHTML = '<span style="color:#d9534f;">未找到结果，请换个关键词。</span>';
                    return;
                }

                data.forEach(game => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    const proxyUrl = `/proxy_image?url=${encodeURIComponent(game.url)}`;
                    const cover = document.createElement('img');
                    cover.src = proxyUrl;
                    cover.alt = game.name;
                    const label = document.createElement('div');
                    label.className = 'source-badge';
                    label.textContent = game.name;
                    div.append(cover, label);
                    // 点击搜索结果：获取当前选择的层级，添加卡片
                    div.onclick = () => {
                        const targetTier = document.getElementById('target-tier').value;
                        addGameToTier(game.url, targetTier);
                    };
                    resultsDiv.appendChild(div);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<span style="color:red;">服务连接失败</span>';
                console.error(error);
            }
        }

        // 统一添加卡片入口（手动添加时调用）
        function addGameToTier(originalUrl, tierId) {
            const allCards = document.querySelectorAll('.game-card');
            for (let card of allCards) {
                if (card.dataset.originUrl === originalUrl) {
                    alert('这张图已经在评价表中了');
                    return;
                }
            }
            createCardAndAppend(originalUrl, tierId, true);
        }

        // 创建DOM节点并放入对应位置
        function createCardAndAppend(originalUrl, tierId, shouldSave) {
            if (typeof originalUrl !== "string" || !originalUrl || originalUrl.length > 2048) return;
            
            const container = document.getElementById(tierId);
            if (!container) return;

            const card = document.createElement('div');
            card.className = 'game-card';
            // 重要：保存原始URL以便存档使用
            card.dataset.originUrl = originalUrl;
            
            const proxyUrl = `/proxy_image?url=${encodeURIComponent(originalUrl)}`;
            
            card.innerHTML = `
                <img src="${proxyUrl}" crossorigin="anonymous">
                <div class="delete-btn">×</div>
            `;
            
            // 绑定删除事件
            card.querySelector('.delete-btn').onclick = function() {
                card.remove();
                saveToLocalStorage(); // 删除时触发保存
            };
            
            container.appendChild(card);
            
            if (shouldSave) {
                saveToLocalStorage(); // 添加时触发保存
            }
        }

        function saveImage() {
            const element = document.getElementById("tier-list-container");
            const btn = document.querySelector('.save-btn');
            
            btn.innerText = "处理中...";
            btn.disabled = true;

            html2canvas(element, {
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#0d0d0d",
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `TierList_${new Date().getTime()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "📸 保存评价表";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
